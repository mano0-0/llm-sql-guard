[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-sql-guard"
version = "0.1.0"
description = "Validate LLM-generated SQL against a policy before it reaches your database."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["llm", "sql", "security", "text-to-sql", "guardrails", "sqlglot"]
dependencies = ["sqlglot>=25.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
